<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #edf3f8;
      --panel-top: #fbfdff;
      --panel-bottom: #edf2f7;
      --card: #ffffff;
      --ink: #17212b;
      --muted: #66758a;
      --line: #d6e0ea;
      --line-strong: #c7d4e1;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #e8f0ff;
      --green: #15803d;
      --green-soft: #edf8ef;
      --amber: #b45309;
      --amber-soft: #fff4e5;
      --shadow: 0 16px 36px rgba(15, 23, 42, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.12), transparent 28%),
        linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
    }

    body {
      padding: 18px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hero {
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    .hero-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 800;
    }

    .hero-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .info-card {
      padding: 11px 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .info-card-accent {
      background: var(--green-soft);
      border-color: #bbdfc5;
    }

    .info-card-warm {
      background: var(--amber-soft);
      border-color: #f4d09a;
    }

    .info-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 20px;
      line-height: 1.25;
      font-weight: 850;
      word-break: break-word;
    }

    .info-note {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      font-weight: 700;
    }

    .section {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.05);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 170px 130px;
      gap: 10px;
      align-items: end;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.05);
    }

    .control-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    select,
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 14px;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }

    input:disabled {
      color: var(--muted);
      background: #f1f5f9;
      cursor: not-allowed;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .section-copy {
      margin: 0;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .section-copy-muted {
      color: var(--muted);
    }

    .claim-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .claim-card {
      padding: 12px 13px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #f8fafc;
    }

    .claim-title {
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 850;
    }

    .claim-meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .detail-value {
      color: var(--ink);
      font-weight: 700;
      word-break: break-word;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      min-width: 140px;
      padding: 13px 15px;
      border: none;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(180deg, var(--blue), var(--blue-dark));
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.12);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--blue-dark);
      border: 1px solid var(--line-strong);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: none;
    }

    .loading {
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      font-weight: 700;
    }

    .error {
      padding: 12px 13px;
      border: 1px solid #fecaca;
      border-radius: 14px;
      background: #fef2f2;
      color: #991b1b;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="app" class="panel"></div>

  <script id="claim-stats-report-data" type="application/json"><?!= JSON.stringify(report) ?></script>

  <script>
    let currentReport = JSON.parse(
      document.getElementById('claim-stats-report-data').textContent
    );

    function init() {
      renderReport(currentReport);
    }

    function renderReport(report) {
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(buildHero(report));
      app.appendChild(buildControls(report));
      app.appendChild(buildClaimSection('New Claims Added', report.sections.newClaims));
      app.appendChild(buildClaimSection('Liability Confirmed', report.sections.liabilityConfirmed));
      app.appendChild(buildClaimSection('Confirmed From Same Period New Claims', report.sections.samePeriodConfirmed));
      app.appendChild(buildDetailsSection(report));
      app.appendChild(buildActions());
    }

    function buildHero(data) {
      const hero = document.createElement('section');
      hero.className = 'hero';

      const top = document.createElement('div');
      top.className = 'hero-top';

      const left = document.createElement('div');

      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = data.badge || 'Claim Statistics';
      left.appendChild(badge);

      const title = document.createElement('h1');
      title.className = 'hero-title';
      title.textContent = data.title || 'Claim Statistics';
      left.appendChild(title);

      const subtitle = document.createElement('p');
      subtitle.className = 'hero-subtitle';
      subtitle.textContent = data.subtitle || '';
      left.appendChild(subtitle);

      top.appendChild(left);
      hero.appendChild(top);

      const grid = document.createElement('div');
      grid.className = 'info-grid';
      grid.appendChild(buildInfoCard('New Claims Added', data.totals.newClaims, 'logged'));
      grid.appendChild(buildInfoCard('Liability Confirmed', data.totals.liabilityConfirmed, 'moved', 'info-card-accent'));
      grid.appendChild(buildInfoCard('Same Period Confirmed', data.totals.samePeriodConfirmed, 'matched', 'info-card-warm'));
      hero.appendChild(grid);

      return hero;
    }

    function buildControls(data) {
      const controls = document.createElement('section');
      controls.className = 'controls';

      const periodField = document.createElement('label');
      periodField.className = 'control-field';
      const periodLabel = document.createElement('span');
      periodLabel.className = 'control-label';
      periodLabel.textContent = 'Period';
      periodField.appendChild(periodLabel);

      const periodSelect = document.createElement('select');
      periodSelect.id = 'claimStatsPeriod';
      [
        ['day', 'Day'],
        ['week', 'Week'],
        ['month', 'Month'],
        ['all', 'All']
      ].forEach(function(optionConfig) {
        const option = document.createElement('option');
        option.value = optionConfig[0];
        option.textContent = optionConfig[1];
        option.selected = option.value === (data.period || 'day');
        periodSelect.appendChild(option);
      });
      periodSelect.addEventListener('change', syncDateInputState);
      periodField.appendChild(periodSelect);
      controls.appendChild(periodField);

      const dateField = document.createElement('label');
      dateField.className = 'control-field';
      const dateLabel = document.createElement('span');
      dateLabel.className = 'control-label';
      dateLabel.textContent = 'Report Date';
      dateField.appendChild(dateLabel);

      const dateInput = document.createElement('input');
      dateInput.id = 'claimStatsDate';
      dateInput.type = 'date';
      dateInput.value = data.anchorDateKey || '';
      dateField.appendChild(dateInput);
      controls.appendChild(dateField);

      const refreshButton = document.createElement('button');
      refreshButton.type = 'button';
      refreshButton.id = 'claimStatsRefresh';
      refreshButton.className = 'btn';
      refreshButton.textContent = 'Refresh';
      refreshButton.addEventListener('click', refreshReport);
      controls.appendChild(refreshButton);

      setTimeout(syncDateInputState, 0);
      return controls;
    }

    function buildInfoCard(label, value, note, extraClass) {
      const card = document.createElement('div');
      card.className = 'info-card' + (extraClass ? ' ' + extraClass : '');

      const labelNode = document.createElement('span');
      labelNode.className = 'info-label';
      labelNode.textContent = label;
      card.appendChild(labelNode);

      const valueNode = document.createElement('div');
      valueNode.className = 'info-value';
      valueNode.textContent = String(value || 0);
      card.appendChild(valueNode);

      const noteNode = document.createElement('div');
      noteNode.className = 'info-note';
      noteNode.textContent = note;
      card.appendChild(noteNode);

      return card;
    }

    function buildClaimSection(titleText, claims) {
      const section = document.createElement('section');
      section.className = 'section';

      const title = document.createElement('h2');
      title.className = 'section-title';
      title.textContent = titleText;
      section.appendChild(title);

      if (!claims || !claims.length) {
        const empty = document.createElement('p');
        empty.className = 'section-copy section-copy-muted';
        empty.textContent = 'No claims were logged for this section.';
        section.appendChild(empty);
        return section;
      }

      const list = document.createElement('div');
      list.className = 'claim-list';
      claims.forEach(function(claim) {
        list.appendChild(buildClaimCard(claim));
      });
      section.appendChild(list);

      return section;
    }

    function buildClaimCard(claim) {
      const card = document.createElement('article');
      card.className = 'claim-card';

      const title = document.createElement('h3');
      title.className = 'claim-title';
      title.textContent = [claim.claimNumber, claim.rego].filter(Boolean).join(' / ') || claim.claimKey || 'Claim';
      card.appendChild(title);

      const meta = document.createElement('p');
      meta.className = 'claim-meta';
      meta.textContent = [claim.clientName, claim.insurer].filter(Boolean).join(' - ') || 'No client or insurer recorded';
      card.appendChild(meta);

      if (claim.loggedAt) {
        const logged = document.createElement('p');
        logged.className = 'claim-meta';
        logged.textContent = 'Logged ' + claim.loggedAt;
        card.appendChild(logged);
      }

      return card;
    }

    function buildDetailsSection(data) {
      const section = document.createElement('section');
      section.className = 'section';

      const title = document.createElement('h2');
      title.className = 'section-title';
      title.textContent = 'Report Details';
      section.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'detail-grid';
      grid.appendChild(buildDetailRow('Range', data.rangeLabel || 'Not provided'));
      grid.appendChild(buildDetailRow('Filter', data.filterLabel || 'Not provided'));
      grid.appendChild(buildDetailRow('Last scanned', data.lastScanned || 'Not provided'));
      grid.appendChild(buildDetailRow('Source', '_Claim Stats Log'));
      section.appendChild(grid);

      return section;
    }

    function buildDetailRow(label, value) {
      const row = document.createElement('div');
      row.className = 'detail-row';

      const labelNode = document.createElement('div');
      labelNode.textContent = label;
      row.appendChild(labelNode);

      const valueNode = document.createElement('div');
      valueNode.className = 'detail-value';
      valueNode.textContent = value;
      row.appendChild(valueNode);

      return row;
    }

    function buildActions() {
      const actions = document.createElement('div');
      actions.className = 'actions';

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn';
      button.textContent = 'Close';
      button.addEventListener('click', function() {
        google.script.host.close();
      });
      actions.appendChild(button);

      return actions;
    }

    function syncDateInputState() {
      const periodSelect = document.getElementById('claimStatsPeriod');
      const dateInput = document.getElementById('claimStatsDate');
      if (!periodSelect || !dateInput) {
        return;
      }

      const isAll = periodSelect.value === 'all';
      dateInput.disabled = isAll;
    }

    function refreshReport() {
      const periodSelect = document.getElementById('claimStatsPeriod');
      const dateInput = document.getElementById('claimStatsDate');
      const refreshButton = document.getElementById('claimStatsRefresh');
      const app = document.getElementById('app');
      const status = document.createElement('div');
      const period = periodSelect ? periodSelect.value : 'day';
      const dateValue = dateInput && !dateInput.disabled ? dateInput.value : '';

      if (refreshButton) {
        refreshButton.disabled = true;
        refreshButton.textContent = 'Refreshing';
      }

      status.className = 'loading';
      status.textContent = 'Refreshing claim statistics...';
      app.insertBefore(status, app.children[2] || null);

      google.script.run
        .withSuccessHandler(function(nextReport) {
          currentReport = nextReport;
          renderReport(currentReport);
        })
        .withFailureHandler(function(error) {
          status.className = 'error';
          status.textContent = error && error.message ? error.message : String(error);
          if (refreshButton) {
            refreshButton.disabled = false;
            refreshButton.textContent = 'Refresh';
          }
        })
        .getClaimStatsReport(period, dateValue);
    }

    init();
  </script>
</body>
</html>
