<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #eef3f8;
      --panel-top: #f8fbff;
      --panel-bottom: #ebf1f6;
      --card: #ffffff;
      --ink: #17212b;
      --muted: #66758a;
      --line: #d7e0ea;
      --line-strong: #c8d4e2;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #e8f0ff;
      --amber: #b45309;
      --amber-soft: #fff4e5;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.10), transparent 34%),
        linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
      color: var(--ink);
    }

    body {
      padding: 14px;
    }

    .shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #e7eefb;
      color: #315891;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .hero-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 800;
    }

    .hero-copy {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--blue);
    }

    .card-calendar::before {
      background: var(--amber);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 800;
      word-break: break-word;
    }

    .badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge-standard {
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    .badge-calendar {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .card-subtitle {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .meta-strip {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .meta-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 12px;
    }

    .meta-label {
      color: var(--muted);
      font-weight: 600;
    }

    .meta-value {
      color: var(--ink);
      font-weight: 700;
      text-align: right;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, var(--blue), var(--blue-dark));
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.22);
    }

    .button:hover {
      filter: brightness(1.02);
    }

    .button:disabled {
      background: #a9c1f7;
      box-shadow: none;
      cursor: not-allowed;
    }

    .empty,
    .loading {
      padding: 18px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px dashed var(--line-strong);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      box-shadow: var(--shadow);
    }

    .footer {
      padding: 0 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="eyebrow">Legal Portal</div>
      <h1 class="hero-title">Review Monitor</h1>
      <p class="hero-copy">Track pending standard and calendar reviews from the active sheet context.</p>
    </section>

    <div id="list" class="loading">Scanning pending reviews...</div>

    <div class="footer">This list refreshes automatically every few seconds.</div>
  </div>

  <script>
    const REFRESH_INTERVAL_MS = 3500;

    function refresh() {
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(renderError)
        .getPendingReviewItems();
    }

    function openReview(button, reviewKey) {
      button.disabled = true;
      button.textContent = 'Opening...';

      google.script.run
        .withFailureHandler(function() {
          button.disabled = false;
          button.textContent = 'Open Review';
        })
        .showApprovalModal(reviewKey);
    }

    function render(result) {
      const list = document.getElementById('list');
      list.className = 'list';
      list.replaceChildren();

      const items = result && Array.isArray(result.items) ? result.items : [];
      const emptyMessage = result && result.emptyMessage
        ? result.emptyMessage
        : 'No pending reviews.';

      if (!items.length) {
        list.className = 'empty';
        list.textContent = emptyMessage;
        return;
      }

      items.forEach(function(item) {
        list.appendChild(buildCard(item));
      });
    }

    function renderError(error) {
      const list = document.getElementById('list');
      list.className = 'empty';
      list.textContent = 'Unable to load pending reviews right now.';
      console.error(error);
    }

    function buildCard(item) {
      const card = document.createElement('article');
      card.className = 'card' + (item.type === 'calendar' ? ' card-calendar' : '');

      const head = document.createElement('div');
      head.className = 'card-head';

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = item.title || 'Untitled Review';
      head.appendChild(title);

      const badge = document.createElement('span');
      badge.className = 'badge ' + (item.type === 'calendar' ? 'badge-calendar' : 'badge-standard');
      badge.textContent = item.type === 'calendar' ? 'Calendar' : 'Standard';
      head.appendChild(badge);

      card.appendChild(head);

      const subtitle = document.createElement('p');
      subtitle.className = 'card-subtitle';
      subtitle.textContent = item.subtitle || item.reviewStatus || '';
      card.appendChild(subtitle);

      const metaStrip = document.createElement('div');
      metaStrip.className = 'meta-strip';
      buildMetaRows(item).forEach(function(metaRow) {
        metaStrip.appendChild(metaRow);
      });
      card.appendChild(metaStrip);

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'button';
      button.textContent = 'Open Review';
      button.addEventListener('click', function() {
        openReview(button, item.reviewKey);
      });
      card.appendChild(button);

      return card;
    }

    function buildMetaRows(item) {
      if (item.type === 'calendar') {
        return [
          buildMetaPill('Events', getEventCountText(item)),
          buildMetaPill('Status', item.reviewStatus || 'Awaiting Review')
        ];
      }

      return [
        buildMetaPill('Status', item.reviewStatus || 'Awaiting Review'),
        buildMetaPill('Received', item.data && item.data.emailDateText ? item.data.emailDateText : 'Not provided')
      ];
    }

    function buildMetaPill(label, value) {
      const row = document.createElement('div');
      row.className = 'meta-pill';

      const left = document.createElement('span');
      left.className = 'meta-label';
      left.textContent = label;
      row.appendChild(left);

      const right = document.createElement('span');
      right.className = 'meta-value';
      right.textContent = value;
      row.appendChild(right);

      return row;
    }

    function getEventCountText(item) {
      const events = item && item.data && Array.isArray(item.data.eventsToNote)
        ? item.data.eventsToNote.length
        : 0;

      return events + ' event' + (events === 1 ? '' : 's') + ' to note';
    }

    setInterval(refresh, REFRESH_INTERVAL_MS);
    refresh();
  </script>
</body>
</html>
