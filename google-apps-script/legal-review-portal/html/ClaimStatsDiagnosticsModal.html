<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --panel-top: #fbfdff;
      --panel-bottom: #edf2f7;
      --card: #ffffff;
      --ink: #17212b;
      --muted: #66758a;
      --line: #d6e0ea;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #e8f0ff;
      --shadow: 0 16px 36px rgba(15, 23, 42, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.10), transparent 28%),
        linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
    }

    body {
      padding: 18px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hero,
    .section {
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.05);
    }

    .hero {
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero-title {
      margin: 9px 0 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 800;
    }

    .hero-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .section {
      padding: 16px;
      border-radius: 18px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .metric-card,
    .entry-card {
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f8fafc;
    }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 5px;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 850;
    }

    .count-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .count-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.4;
    }

    .count-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .count-label {
      color: var(--muted);
      font-weight: 700;
    }

    .count-value {
      font-weight: 850;
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entry-type {
      display: inline-flex;
      width: fit-content;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .entry-key {
      margin: 7px 0 0;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 850;
      word-break: break-word;
    }

    .entry-time,
    .note {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      min-width: 140px;
      padding: 13px 15px;
      border: none;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(180deg, var(--blue), var(--blue-dark));
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.12);
    }
  </style>
</head>
<body>
  <div id="app" class="panel"></div>

  <script id="claim-stats-diagnostics-data" type="application/json"><?!= JSON.stringify(diagnostics) ?></script>

  <script>
    const diagnostics = JSON.parse(
      document.getElementById('claim-stats-diagnostics-data').textContent
    );

    function init() {
      const app = document.getElementById('app');
      app.appendChild(buildHero(diagnostics));
      app.appendChild(buildCurrentScanSection(diagnostics));
      app.appendChild(buildLogSummarySection(diagnostics));
      app.appendChild(buildEventCountsSection(diagnostics));
      app.appendChild(buildRecentRowsSection(diagnostics));
      app.appendChild(buildNotesSection());
      app.appendChild(buildActions());
    }

    function buildHero(data) {
      const hero = document.createElement('section');
      hero.className = 'hero';

      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = 'Diagnostics';
      hero.appendChild(badge);

      const title = document.createElement('h1');
      title.className = 'hero-title';
      title.textContent = data.title || 'Claim Statistics Diagnostics';
      hero.appendChild(title);

      const subtitle = document.createElement('p');
      subtitle.className = 'hero-subtitle';
      subtitle.textContent = 'Last scanned: ' + (data.lastScanned || 'Not available');
      hero.appendChild(subtitle);

      return hero;
    }

    function buildCurrentScanSection(data) {
      return buildMetricSection('Current Sheet Scan', [
        ['New Claims Section', data.currentScan.newClaimsRows, 'rows'],
        ['Liability Confirmed', data.currentScan.liabilityConfirmedRows, 'rows']
      ]);
    }

    function buildLogSummarySection(data) {
      return buildMetricSection('Log Summary', [
        ['Total Log Rows', data.logSummary.totalRows, 'rows'],
        ['Reportable Events', data.logSummary.reportableEvents, 'events']
      ]);
    }

    function buildMetricSection(titleText, metrics) {
      const section = buildSection(titleText);
      const grid = document.createElement('div');
      grid.className = 'metric-grid';

      metrics.forEach(function(metric) {
        const card = document.createElement('div');
        card.className = 'metric-card';

        const label = document.createElement('span');
        label.className = 'metric-label';
        label.textContent = metric[0];
        card.appendChild(label);

        const value = document.createElement('div');
        value.className = 'metric-value';
        value.textContent = String(metric[1] || 0) + ' ' + metric[2];
        card.appendChild(value);

        grid.appendChild(card);
      });

      section.appendChild(grid);
      return section;
    }

    function buildEventCountsSection(data) {
      const section = buildSection('Event Counts');
      const list = document.createElement('div');
      list.className = 'count-list';

      [
        ['Baseline New Claims', data.eventCounts.baselineNewClaim],
        ['Baseline Liability Confirmed', data.eventCounts.baselineLiabilityConfirmed],
        ['New Claims', data.eventCounts.newClaim],
        ['Liability Confirmed', data.eventCounts.liabilityConfirmed]
      ].forEach(function(row) {
        list.appendChild(buildCountRow(row[0], row[1]));
      });

      section.appendChild(list);
      return section;
    }

    function buildCountRow(labelText, value) {
      const row = document.createElement('div');
      row.className = 'count-row';

      const label = document.createElement('div');
      label.className = 'count-label';
      label.textContent = labelText;
      row.appendChild(label);

      const count = document.createElement('div');
      count.className = 'count-value';
      count.textContent = String(value || 0);
      row.appendChild(count);

      return row;
    }

    function buildRecentRowsSection(data) {
      const section = buildSection('Recent Log Entries');
      const rows = data.recentRows || [];

      if (!rows.length) {
        const empty = document.createElement('p');
        empty.className = 'note';
        empty.textContent = 'No log entries found.';
        section.appendChild(empty);
        return section;
      }

      const list = document.createElement('div');
      list.className = 'entry-list';
      rows.forEach(function(row) {
        list.appendChild(buildEntryCard(row));
      });

      section.appendChild(list);
      return section;
    }

    function buildEntryCard(row) {
      const card = document.createElement('article');
      card.className = 'entry-card';

      const type = document.createElement('span');
      type.className = 'entry-type';
      type.textContent = row.eventType || 'Event';
      card.appendChild(type);

      const key = document.createElement('p');
      key.className = 'entry-key';
      key.textContent = row.claimKey || 'No claim key';
      card.appendChild(key);

      const time = document.createElement('p');
      time.className = 'entry-time';
      time.textContent = row.loggedAt || 'No timestamp';
      card.appendChild(time);

      return card;
    }

    function buildNotesSection() {
      const section = buildSection('Notes');
      const note = document.createElement('p');
      note.className = 'note';
      note.textContent = 'Diagnostics are for troubleshooting only. Baseline rows preserve the initial sheet state and are not counted in standard reports.';
      section.appendChild(note);
      return section;
    }

    function buildSection(titleText) {
      const section = document.createElement('section');
      section.className = 'section';

      const title = document.createElement('h2');
      title.className = 'section-title';
      title.textContent = titleText;
      section.appendChild(title);

      return section;
    }

    function buildActions() {
      const actions = document.createElement('div');
      actions.className = 'actions';

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn';
      button.textContent = 'Close';
      button.addEventListener('click', function() {
        google.script.host.close();
      });
      actions.appendChild(button);

      return actions;
    }

    init();
  </script>
</body>
</html>
