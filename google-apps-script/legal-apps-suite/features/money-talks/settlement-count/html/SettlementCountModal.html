<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #eef3f8;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #66758a;
      --line: #d7e0ea;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #e8f0ff;
      --red-soft: #fee2e2;
      --red: #b91c1c;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #f8fbff, var(--bg));
      color: var(--ink);
    }

    body {
      padding: 16px;
    }

    .modal-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hero,
    .section,
    .controls,
    .notice {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 18px;
    }

    .badge {
      display: inline-flex;
      margin-bottom: 8px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .hero-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 800;
    }

    .hero-subtitle,
    .metric-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .hero-subtitle {
      margin: 6px 0 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .metric-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 30px;
      line-height: 1;
      font-weight: 800;
    }

    .metric-note {
      margin-top: 4px;
      font-size: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      padding: 14px;
    }

    .control-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    select,
    input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 13px;
    }

    input:disabled {
      background: #f1f5f9;
      color: #94a3b8;
    }

    .btn {
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      cursor: pointer;
      color: #fff;
      background: var(--blue);
      font-size: 13px;
      font-weight: 800;
    }

    .btn:hover {
      background: var(--blue-dark);
    }

    .btn:disabled {
      cursor: not-allowed;
      background: #9db7f4;
    }

    .section {
      padding: 14px;
      box-shadow: none;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .detail-list {
      display: grid;
      gap: 8px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      font-size: 13px;
    }

    .detail-value {
      font-weight: 700;
      text-align: right;
    }

    .notice {
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .notice-error {
      border-color: #fecaca;
      color: var(--red);
      background: var(--red-soft);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <script id="settlement-count-report-data" type="application/json"><?!= JSON.stringify(report) ?></script>
  <div id="app" class="modal-panel"></div>

  <script>
    const PRESETS = [
      ['today', 'Today'],
      ['this_week', 'This Week'],
      ['this_month', 'This Month'],
      ['this_year', 'This Year'],
      ['custom', 'Custom'],
      ['all', 'All']
    ];
    let report = readJson('settlement-count-report-data');
    let loading = false;
    let errorMessage = '';

    function readJson(id) {
      const node = document.getElementById(id);
      try {
        return JSON.parse(node && node.textContent ? node.textContent : '{}');
      } catch (error) {
        return {};
      }
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = [
        renderHero(report),
        renderControls(report),
        loading ? '<div class="notice">Refreshing settlement count...</div>' : '',
        errorMessage ? '<div class="notice notice-error">' + escapeHtml(errorMessage) + '</div>' : '',
        renderDetails(report),
        '<div class="actions"><button class="btn" type="button" data-action="close">Close</button></div>'
      ].join('');
      bindEvents();
    }

    function renderHero(data) {
      return [
        '<section class="hero">',
          '<span class="badge">' + escapeHtml(data.badge || 'Settlement Count') + '</span>',
          '<h1 class="hero-title">' + escapeHtml(data.title || 'Settlement Count') + '</h1>',
          '<p class="hero-subtitle">' + escapeHtml(data.subtitle || '') + '</p>',
          '<div class="metric-grid">',
            '<div class="metric-card">',
              '<span class="metric-label">Settlements Count</span>',
              '<div class="metric-value">' + escapeHtml(data.totalSettlements || 0) + '</div>',
              '<div class="metric-note">settled rows</div>',
            '</div>',
          '</div>',
        '</section>'
      ].join('');
    }

    function renderControls(data) {
      const preset = data.preset || 'custom';
      const isCustom = preset === 'custom';
      return [
        '<section class="controls">',
          '<label class="control-field"><span class="control-label">Preset</span>',
            '<select id="preset">' + PRESETS.map(function(item) {
              return '<option value="' + item[0] + '"' + (item[0] === preset ? ' selected' : '') + '>' + item[1] + '</option>';
            }).join('') + '</select>',
          '</label>',
          '<label class="control-field"><span class="control-label">From</span>',
            '<input id="fromDate" type="date" value="' + escapeHtml(data.fromDateKey || '') + '"' + (isCustom ? '' : ' disabled') + '>',
          '</label>',
          '<label class="control-field"><span class="control-label">To</span>',
            '<input id="toDate" type="date" value="' + escapeHtml(data.toDateKey || '') + '"' + (isCustom ? '' : ' disabled') + '>',
          '</label>',
          '<button class="btn" type="button" data-action="refresh"' + (loading ? ' disabled' : '') + '>' + (loading ? 'Refreshing' : 'Refresh') + '</button>',
        '</section>'
      ].join('');
    }

    function renderDetails(data) {
      return [
        '<section class="section">',
          '<h2 class="section-title">Report Details</h2>',
          '<div class="detail-list">',
            detailRow('Range', data.rangeLabel || 'Not provided'),
            detailRow('Last scanned', data.lastScanned || 'Not provided'),
          '</div>',
        '</section>'
      ].join('');
    }

    function detailRow(label, value) {
      return '<div class="detail-row"><div>' + escapeHtml(label) + '</div><div class="detail-value">' + escapeHtml(value || '-') + '</div></div>';
    }

    function bindEvents() {
      const preset = document.getElementById('preset');
      if (preset) {
        preset.addEventListener('change', handlePresetChange);
      }
      document.querySelectorAll('[data-action="refresh"]').forEach(function(button) {
        button.addEventListener('click', refreshReport);
      });
      document.querySelectorAll('[data-action="close"]').forEach(function(button) {
        button.addEventListener('click', function() {
          google.script.host.close();
        });
      });
    }

    function handlePresetChange(event) {
      const value = event.target.value;
      const defaults = report.rangeDefaults || {};
      report.preset = value;
      if (value !== 'custom') {
        const range = defaults[value] || {};
        report.fromDateKey = value === 'all' ? '' : (range.fromDateKey || report.fromDateKey || '');
        report.toDateKey = value === 'all' ? '' : (range.toDateKey || report.toDateKey || '');
      }
      render();
    }

    function refreshReport() {
      const preset = document.getElementById('preset').value;
      const fromDate = preset === 'all' ? '' : document.getElementById('fromDate').value;
      const toDate = preset === 'all' ? '' : document.getElementById('toDate').value;
      loading = true;
      errorMessage = '';
      render();
      google.script.run
        .withSuccessHandler(function(nextReport) {
          report = nextReport || {};
          loading = false;
          render();
        })
        .withFailureHandler(function(error) {
          loading = false;
          errorMessage = error && error.message ? error.message : String(error);
          render();
        })
        .getSettlementCountReport(preset, fromDate, toDate);
    }

    render();
  </script>
</body>
</html>
